
name: Check analysis and build
on:
  pull_request:
  push:
    branches:
      - fix/evidence-based-photo-analysis
      - fix/usable-photo-lens-assessment
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npm test
      - run: npm run build
